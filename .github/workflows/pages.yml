# 部署到 GitHub Pages
#
# 為什麼改用 Actions 而不是「Deploy from a branch」：
# 傳統模式是 GitHub 自己偵測 push，偶爾會漏掉，而且完全沒有可見的狀態——
# 站台沒更新時無從判斷是「還沒跑」「跑失敗」還是「快取」。改成 Actions 之後
# 每次 push 都有明確的 ✓／✗，漏掉時 Actions 頁面上直接按 Re-run 就好，
# 不用再推空 commit 去戳它。
#
# ⚠ 這份 workflow 要生效，Settings → Pages → Source 必須設成「GitHub Actions」。
#    設定前仍由傳統的分支部署負責，兩者不會打架，但也不會有這裡的測試把關。

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 需要時可以從 Actions 頁面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署；不取消進行中的那份，避免半途中斷留下壞掉的站台
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 建置與驗證發布產物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: 建立固定版本測試環境
        run: bash scripts/codex-setup.sh

      - name: 完整驗證
        run: npm run check

      - uses: actions/configure-pages@v5

      # check 只建置一次 _site；上傳的就是通過資源與 PWA 驗證的那份。
      # CNAME 留作紀錄，實際自訂網域由 Pages 後台設定。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署
    needs: test            # 測試沒過就不部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
