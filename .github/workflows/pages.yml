# 部署到 GitHub Pages
#
# 為什麼改用 Actions 而不是「Deploy from a branch」：
# 傳統模式是 GitHub 自己偵測 push，偶爾會漏掉，而且完全沒有可見的狀態——
# 站台沒更新時無從判斷是「還沒跑」「跑失敗」還是「快取」。改成 Actions 之後
# 每次 push 都有明確的 ✓／✗，漏掉時 Actions 頁面上直接按 Re-run 就好，
# 不用再推空 commit 去戳它。
#
# ⚠ 這份 workflow 要生效，Settings → Pages → Source 必須設成「GitHub Actions」。
#    設定前仍由傳統的分支部署負責，兩者不會打架，但也不會有這裡的測試把關。

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 需要時可以從 Actions 頁面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署；不取消進行中的那份，避免半途中斷留下壞掉的站台
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 回歸測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝 Playwright 與 Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: 起本機伺服器並跑 tests/
        run: |
          # tests/*.mjs 預設連 http://127.0.0.1:8124/，先把站台服起來
          python3 -m http.server 8124 --bind 127.0.0.1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8124/ >/dev/null && break
            sleep 0.5
          done
          # 測試檔裡的 Chrome 路徑寫的是 Windows；CI 用 Playwright 裝的 Chromium 覆寫
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          echo "Chromium: $CHROME_PATH"
          fail=0
          for f in tests/*.mjs; do
            if node "$f" >/tmp/out.txt 2>&1; then
              echo "PASS  $f"
            else
              echo "FAIL  $f"
              sed 's/^/        /' /tmp/out.txt | head -20
              fail=1
            fi
          done
          exit $fail

  deploy:
    name: 部署
    needs: test            # 測試沒過就不部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 組出要上線的檔案
        run: |
          # 排除只有開發用得到的目錄，其餘（含 CNAME、assets、css、src）原樣帶上
          mkdir -p _site
          tar -cf - \
            --exclude=./.git --exclude=./.github --exclude=./tests \
            --exclude=./docs --exclude=./node_modules --exclude=./_site \
            . | tar -xf - -C _site
          # CNAME 決定自訂網域，掉了整個站會變回 *.github.io
          test -f _site/CNAME || { echo "✗ CNAME 不見了，中止部署"; exit 1; }
          test -f _site/index.html || { echo "✗ index.html 不見了，中止部署"; exit 1; }
          echo "將上線的頂層項目："
          ls -1 _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
